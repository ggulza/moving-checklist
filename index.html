<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이사준비">

<title>이사준비 체크리스트</title>
<style>
:root{--g:#2f6f5e;--g2:#e6f2ee;--bg:#f6f7f6;--card:#fff;--tx:#1d2420;--sub:#6b7771;--line:#e3e8e5;--warn:#c4472f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--sub);font-weight:600}
.dday{text-align:center;padding:18px 10px}
.dday .big{font-size:52px;font-weight:800;color:var(--g);letter-spacing:-1px;line-height:1.1}
.dday .date{color:var(--sub);margin-top:4px}
input,select,textarea,button{font:inherit}
input[type=text],input[type=date],input[type=number],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:var(--g2);color:var(--g)}
button.danger{background:#fbeae6;color:var(--warn)}
button.small{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.bar{height:10px;background:var(--g2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--g);width:0;transition:width .3s}
.prog{margin:10px 0}
.prog .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.grp{font-weight:700;font-size:14px;color:var(--g);margin:14px 0 4px;display:flex;justify-content:space-between}
.grp span{color:var(--sub);font-weight:500}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--g);flex:none}
.item .t{flex:1;word-break:break-all}
.item.done .t{color:var(--sub);text-decoration:line-through}
.pr{background:none;color:var(--sub);font-size:13px;padding:4px 8px;border:1px dashed var(--line);border-radius:8px;white-space:nowrap;font-weight:500}
.pr.has{color:var(--tx);border-style:solid;font-weight:700}
.add input.price{flex:0 0 110px}
.vd{font-size:12px;color:var(--sub);margin-top:2px;cursor:pointer}
.x{background:none;color:var(--sub);padding:4px 8px;font-size:18px}
.add{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.add input{flex:1 1 140px}
.add select{flex:0 0 110px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;padding:10px 2px;font-size:12px;font-weight:600}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--g)}
.iv{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.iv.done{background:#f3f7f5}
.iv h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.iv .meta{color:var(--sub);font-size:14px;margin:2px 0 8px}
.money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;font-size:13px}
.money div{background:var(--bg);border-radius:8px;padding:6px 2px}
.money b{display:block;font-size:14px}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
